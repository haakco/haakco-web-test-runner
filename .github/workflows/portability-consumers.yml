name: Portability Consumers

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  portability-consumers:
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'

      - name: Verify PHP 8.3.36
        run: php -r 'if (PHP_VERSION_ID !== 80336) { fwrite(STDERR, "Expected PHP 8.3.36 (PHP_VERSION_ID 80336); got " . PHP_VERSION . " (PHP_VERSION_ID " . PHP_VERSION_ID . ")" . PHP_EOL); exit(1); }'

      - name: Run quality gates
        run: ./ci/quality/run-quality-gates.sh

      - name: Upload portability results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-results
          path: PORTABILITY_RESULTS.md
          if-no-files-found: error
